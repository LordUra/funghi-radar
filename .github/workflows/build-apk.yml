name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK manually
        run: |
          # Usa l'SDK già presente nel runner ubuntu-latest
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH

          # Accetta tutte le licenze senza prompt
          mkdir -p /usr/local/lib/android/sdk/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > /usr/local/lib/android/sdk/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> /usr/local/lib/android/sdk/licenses/android-sdk-license
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> /usr/local/lib/android/sdk/licenses/android-sdk-license
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > /usr/local/lib/android/sdk/licenses/android-sdk-preview-license

          # Installa platform-tools e build-tools se non presenti
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" || true

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android || true

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Fix AndroidManifest permissions
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q "INTERNET" $MANIFEST; then
            sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' $MANIFEST
          fi
          if ! grep -q "ACCESS_NETWORK_STATE" $MANIFEST; then
            sed -i 's/<application/<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"\/>\n    <application/' $MANIFEST
          fi
          if ! grep -q "ACCESS_FINE_LOCATION" $MANIFEST; then
            sed -i 's/<application/<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"\/>\n    <application/' $MANIFEST
          fi

      - name: Install imagemagick
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --fix-missing imagemagick || \
          sudo apt-get install -y --fix-missing imagemagick-6.q16

      - name: Copy app icon
        run: |
          ICON=www/icon.png
          if [ -f "$ICON" ]; then
            for dir in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              case $dir in
                mdpi)    SIZE=48  ;;
                hdpi)    SIZE=72  ;;
                xhdpi)   SIZE=96  ;;
                xxhdpi)  SIZE=144 ;;
                xxxhdpi) SIZE=192 ;;
              esac
              DEST="android/app/src/main/res/mipmap-$dir"
              mkdir -p $DEST
              convert $ICON -resize ${SIZE}x${SIZE} $DEST/ic_launcher.png
              convert $ICON -resize ${SIZE}x${SIZE} $DEST/ic_launcher_round.png
              echo "Icon $dir: ${SIZE}x${SIZE} OK"
            done
            rm -rf android/app/src/main/res/mipmap-anydpi-v26
          fi

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore funghi-radar.keystore \
            -alias funghi-radar \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass funghiRadar2026 \
            -keypass funghiRadar2026 \
            -dname "CN=Andrea Schena, OU=FunghiRadar, O=LordUra, L=Italia, ST=Italia, C=IT"

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Sign and align APK
        run: |
          BUILD_TOOLS=$(ls ${ANDROID_HOME}/build-tools/ | sort -V | tail -1)
          APK=android/app/build/outputs/apk/release/app-release-unsigned.apk
          ALIGNED=android/app/build/outputs/apk/release/funghi-radar-aligned.apk
          SIGNED=android/app/build/outputs/apk/release/funghi-radar-release.apk

          ${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/zipalign -v 4 $APK $ALIGNED

          ${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/apksigner sign \
            --ks funghi-radar.keystore \
            --ks-key-alias funghi-radar \
            --ks-pass pass:funghiRadar2026 \
            --key-pass pass:funghiRadar2026 \
            --out $SIGNED \
            $ALIGNED

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: funghi-radar-release
          path: android/app/build/outputs/apk/release/funghi-radar-release.apk
