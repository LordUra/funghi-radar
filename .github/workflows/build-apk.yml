name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Init Capacitor
        run: npx cap init "Funghi Radar" "com.funghiradar.app" --web-dir www || true

      - name: Add Android platform
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Fix AndroidManifest permissions
        run: |
          FILE=android/app/src/main/AndroidManifest.xml
          if ! grep -q "INTERNET" $FILE; then
            sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' $FILE
          fi

      - name: Generate keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore funghi-radar.keystore \
            -alias funghi-radar \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass funghiradar123 \
            -keypass funghiradar123 \
            -dname "CN=FunghiRadar, OU=Dev, O=FunghiRadar, L=Roma, ST=Lazio, C=IT"

      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Sign and align APK
        run: |
          APK=android/app/build/outputs/apk/release/app-release-unsigned.apk
          SIGNED=android/app/build/outputs/apk/release/funghi-radar-signed.apk
          ALIGNED=android/app/build/outputs/apk/release/funghi-radar-release.apk

          # Sign
          jarsigner \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore $GITHUB_WORKSPACE/funghi-radar.keystore \
            -storepass funghiradar123 \
            -keypass funghiradar123 \
            $APK funghi-radar

          # Find zipalign in Android SDK
          ZIPALIGN=$(find $ANDROID_SDK_ROOT -name "zipalign" -type f | head -1)
          echo "zipalign found at: $ZIPALIGN"
          $ZIPALIGN -v 4 $APK $ALIGNED

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: funghi-radar-release
          path: android/app/build/outputs/apk/release/funghi-radar-release.apk
