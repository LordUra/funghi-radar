name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android || true

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Fix AndroidManifest permissions
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q "INTERNET" $MANIFEST; then
            sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' $MANIFEST
          fi
          if ! grep -q "ACCESS_NETWORK_STATE" $MANIFEST; then
            sed -i 's/<application/<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"\/>\n    <application/' $MANIFEST
          fi
          if ! grep -q "ACCESS_FINE_LOCATION" $MANIFEST; then
            sed -i 's/<application/<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"\/>\n    <application/' $MANIFEST
          fi

      - name: Install imagemagick
        run: sudo apt-get install -y imagemagick

      - name: Copy app icon
        run: |
          ICON=www/icon.png
          if [ -f "$ICON" ]; then
            for dir in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              case $dir in
                mdpi)    SIZE=48  ;;
                hdpi)    SIZE=72  ;;
                xhdpi)   SIZE=96  ;;
                xxhdpi)  SIZE=144 ;;
                xxxhdpi) SIZE=192 ;;
              esac
              DEST="android/app/src/main/res/mipmap-$dir"
              mkdir -p $DEST
              convert $ICON -resize ${SIZE}x${SIZE} $DEST/ic_launcher.png
              convert $ICON -resize ${SIZE}x${SIZE} $DEST/ic_launcher_round.png
              echo "Icon $dir: ${SIZE}x${SIZE} OK"
            done
            rm -rf android/app/src/main/res/mipmap-anydpi-v26
          fi

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore funghi-radar.keystore \
            -alias funghi-radar \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass funghiRadar2026 \
            -keypass funghiRadar2026 \
            -dname "CN=Andrea Schena, OU=FunghiRadar, O=LordUra, L=Italia, ST=Italia, C=IT"

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Sign and align APK
        run: |
          APK=android/app/build/outputs/apk/release/app-release-unsigned.apk
          ALIGNED=android/app/build/outputs/apk/release/funghi-radar-aligned.apk
          SIGNED=android/app/build/outputs/apk/release/funghi-radar-release.apk

          ${ANDROID_HOME}/build-tools/$(ls ${ANDROID_HOME}/build-tools/ | sort -V | tail -1)/zipalign \
            -v 4 $APK $ALIGNED

          ${ANDROID_HOME}/build-tools/$(ls ${ANDROID_HOME}/build-tools/ | sort -V | tail -1)/apksigner \
            sign \
            --ks funghi-radar.keystore \
            --ks-alias funghi-radar \
            --ks-pass pass:funghiRadar2026 \
            --key-pass pass:funghiRadar2026 \
            --out $SIGNED \
            $ALIGNED

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: funghi-radar-release
          path: android/app/build/outputs/apk/release/funghi-radar-release.apk
